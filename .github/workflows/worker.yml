name: Deploy Feishu relay worker

# 飞书转发代理（Cloudflare Worker，worker/）。需要仓库 Secrets：CLOUDFLARE_API_TOKEN（模板「Edit Cloudflare Workers」）、CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/worker/**"
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Relay unit tests
        run: pnpm exec vitest run tests/worker

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: 4.148.0
          command: deploy --config worker/wrangler.jsonc
